<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off-Stage!</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            cursor: pointer; 
            -webkit-tap-highlight-color: transparent; 
        }

        #mainImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            transition: opacity 0.3s ease-in-out; 
        }
    </style>
</head>
<body>

    <img id="mainImage" src="poster.png" alt="Offstage">

    <script>
        const imgElement = document.getElementById('mainImage');
        
        document.body.addEventListener('click', function() {
            const currentSrc = imgElement.getAttribute('src');
            
            if (currentSrc === 'poster.png') {
                imgElement.src = 'Setlist.png';
            } else {
                imgElement.src = 'poster.png';
            }
        });
    </script>

</body>
</html>
